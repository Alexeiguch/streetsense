[project]
name = "streetsense"
version = "0.1.0"
description = "Real-time street-scene assistant for blind and low-vision pedestrians (Meta Global AI Developer Hackathon)"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3",
  "opencv-python-headless>=4.9",
  "numpy",
  "openai>=1.40",
  "transformers>=4.40",
  "torch",
  "flask>=3",
  "lap",
]

[project.optional-dependencies]
speech = ["pyttsx3"]
dev = ["pytest"]

[project.scripts]
streetsense = "streetsense.cli:main"

[tool.setuptools.packages.find]
include = ["streetsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
